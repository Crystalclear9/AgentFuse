name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit and integration tests
        run: python -m pytest tests -q

      - name: Delivery acceptance check
        run: python scripts/acceptance_check.py

      - name: Performance regression guard
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true
        run: python scripts/check_regression.py --repeat 2 --tolerance 60

      - name: Upload the runtime data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agentfuse-runtime-data-${{ matrix.os }}-py${{ matrix.python }}
          path: .agentfuse
          retention-days: 7
          if-no-files-found: ignore
