name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # the runners use a western code page - the runtime and its reports are
      # UTF-8 (Chinese messages, JSON reports)
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # the front end test executes the dashboard script in node
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Requirement audit
        run: python scripts/audit_requirements.py

      - name: Unit and integration tests
        run: python -m pytest tests -q

      - name: Delivery acceptance check
        run: python scripts/acceptance_check.py

      - name: Performance regression guard
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true
        run: python scripts/check_regression.py --repeat 2 --tolerance 60

      - name: Upload the runtime data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentfuse-runtime-data-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .agentfuse
          retention-days: 7
          if-no-files-found: ignore

  pool-matrix:
    name: worker pool ${{ matrix.pool }}/${{ matrix.workers }}
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        pool: [0, 1, 2]
        workers: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests with pool ${{ matrix.pool }} and ${{ matrix.workers }} workers
        env:
          AGENTFUSE_TEST_POOL_SIZE: ${{ matrix.pool }}
          AGENTFUSE_TEST_WORKERS: ${{ matrix.workers }}
        run: python -m pytest tests -q

      - name: Upload the runtime data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentfuse-pool-${{ matrix.pool }}-${{ matrix.workers }}
          path: .agentfuse
          retention-days: 7
          if-no-files-found: ignore

  guard-selftest:
    name: the guards really catch a broken behaviour
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The self test breaks one behaviour at a time and asserts that the
      # guard notices.  A guard that cannot fail protects nothing.
      - name: Guard self test
        run: python scripts/guard_selftest.py

  soak:
    name: long running observation
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Soak the runtime
        run: python scripts/soak.py --minutes 10 --scenario shared --workers 2

      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentfuse-soak-report
          path: .agentfuse/reports
          retention-days: 7
          if-no-files-found: ignore
